name: Set up the game workspace
description: Node 22 and this project's dependencies.

# No browser here: the browser jobs run in Playwright's own image, which carries
# Chromium and its libraries at the version the lockfile pins (see the browser
# job). The cache-and-install-deps dance this used to do cost 35 s to 2 min a shard.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: game/package-lock.json

    - shell: bash
      working-directory: game
      run: npm ci
