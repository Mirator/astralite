name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      captures:
        description: >-
          Produce the reference frames and upload them. Off by default: nothing
          asserts on a PNG, and a green run used to draw eighty of them and
          throw them away. This is how the reviewed set is taken, because it has
          to come off the same SwiftShader the baseline did.
        type: boolean
        default: false

# The default for every job, and therefore everything a pull request can reach —
# including a pull request from a fork. Only the deploy job widens it, and a pull
# request cannot start the deploy job.
permissions:
  contents: read

# A superseded pull request commit is not worth finishing. A superseded main
# commit is: it is a deployment candidate, and cancelling it here would mean it
# never reaches Pages.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gates and the build run side by side, and `deploy` waits on all of them.
# Building publishes nothing — `upload-pages-artifact` writes to this run's own
# artifact storage — so a failed gate still means nothing reaches Pages, and the
# happy path does not pay for the gates twice over in wall-clock time.
jobs:
  # The fast gates. Nothing here needs a browser, so nothing here waits for one.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # vinext build strips types rather than checking them, so nothing else in
      # this pipeline would notice a type error before it shipped.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Where the whole wall clock of this pipeline lives: the browser suite is
  # thirty-odd minutes of work and everything else is under a minute. It is cut
  # two ways at once.
  #
  # Across machines, by shard. Six rather than two, because the runners are free
  # on a public repository and the only floor is the ~50s each one spends on
  # checkout, `npm ci` and starting the dev server.
  #
  # And on each machine, by worker. The single worker was never a correctness
  # constraint — see the note in playwright.config.ts — and a runner has four
  # cores that one software rasteriser cannot use. Two is deliberate rather than
  # four: SwiftShader is CPU-bound, so the second worker nearly pays for itself
  # and the third and fourth would mostly contend. Lower it to 1 here if a
  # scenario ever turns out to mind the company; nothing else needs to change.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: game
    env:
      GAME_TEST_WORKERS: 2
      # The reference frames are for a human, nothing asserts on them, and the
      # upload below only fires on a failure — so a green run drew eighty
      # software-rasterised frames and deleted them. Ask for them explicitly.
      GAME_TEST_CAPTURE: ${{ inputs.captures && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/6
      # Traces and screenshots are only written when something failed, and they
      # are the whole reason a red run is diagnosable without a local repro.
      # The capture run uploads on success too: the frames are its entire point.
      - if: failure() || inputs.captures
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            game/playwright-report
            game/test-results
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The build runs on pull requests too: a build that no longer compiles is
      # exactly what a pull request should catch, before main is the thing broken.
      - run: npm run build

      # GitHub Pages serves from a repository sub-path; the export writes
      # root-absolute asset URLs. See scripts/pages-relative-paths.mjs.
      # Unconditional so that a regression in the rewrite surfaces on the pull
      # request rather than on the deploy that follows the merge.
      - run: node scripts/pages-relative-paths.mjs dist/client

      # Not verification — this only hands the built site to the deploy job, so
      # it is skipped when no deploy can follow. Uploading an artifact needs no
      # GITHUB_TOKEN permission, which is why it can stay in this read-only job.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: game/dist/client
          # Preserve v3's inclusion of dotfiles such as .nojekyll.
          include-hidden-files: true

  deploy:
    # Every gate, then the deployment. This is the line that keeps a red suite
    # off the live site.
    needs: [checks, browser, build]
    # A pull request must never be able to publish to Pages, whatever it changed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Write access lives here alone, in the one job no pull request can trigger.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let a running deployment finish; queue at most one more behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Moved off the build job because it reads the Pages API with the workflow
      # token, which a pull request run is deliberately not given.
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
