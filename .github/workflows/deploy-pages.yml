name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      captures:
        description: >-
          Produce the reference frames and upload them. Off by default: nothing
          asserts on a PNG, and a green run used to draw eighty of them and
          throw them away. This is how the reviewed set is taken, because it has
          to come off the same SwiftShader the baseline did.
        type: boolean
        default: false

# The default for every job, and therefore everything a pull request can reach —
# including a pull request from a fork. Only the deploy job widens it, and a pull
# request cannot start the deploy job.
permissions:
  contents: read

# A superseded pull request commit is not worth finishing. A superseded main
# commit is: it is a deployment candidate, and cancelling it here would mean it
# never reaches Pages.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gates and the build run side by side, and `deploy` waits on all of them.
# Building publishes nothing — `upload-pages-artifact` writes to this run's own
# artifact storage — so a failed gate still means nothing reaches Pages, and the
# happy path does not pay for the gates twice over in wall-clock time.
#
# All three sit behind `changes`, so a change that touches only prose skips them,
# and `verified` is the one check that reports either way.
jobs:
  # Twenty minutes of browser suite for a typo in a plan is the cost this pays
  # off. Plain git rather than a paths-filter action: the question is one diff,
  # and every action this pipeline runs is GitHub's own; a third-party one, run
  # with the checkout, is more supply chain than one diff is worth.
  #
  # Every doubt resolves to "code changed". A new branch (all-zero `before`), a
  # force-push whose `before` is gone, a git error, an empty diff, a manual run —
  # each runs the full set, because a wrong skip ships untested code and a wrong
  # run only costs time.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # Full history so both ends of the range are present locally; the whole
      # repository is tens of megabytes, which is cheaper than being clever.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          code=true
          commit() { [[ "$1" =~ ^[0-9a-f]{40}$ && ! "$1" =~ ^0+$ ]] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          # Three dots on a pull request: what the branch changed since it left
          # main, not everything main has gained since.
          case "$EVENT" in
            pull_request) commit "$PR_BASE" && commit "$PR_HEAD" && range="$PR_BASE...$PR_HEAD" ;;
            push) commit "$BEFORE" && commit "$AFTER" && range="$BEFORE..$AFTER" ;;
          esac
          # --no-renames, or moving game/app/x.ts to docs/x.md would list only
          # the new path and read as docs-only.
          if [ -n "${range:-}" ] && files=$(git diff --name-only --no-renames "$range"); then
            code=false
            # `*` in a case pattern crosses slashes, so `*.md` is any depth. An
            # empty diff arrives as one empty line and falls through to code.
            # Order matters: .github and game/public are code even when the file
            # is markdown — one steers this pipeline, the other ships to Pages.
            while IFS= read -r file; do
              case "$file" in
                .github/*|game/public/*) code=true ;;
                *.md|docs/*|plans/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
            printf '%s\n' "$files"
          else
            echo "No usable range for $EVENT; treating it as a code change."
          fi
          echo "code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The one check branch protection should require, and the only one it can:
  # the gates above skip on a docs-only change, and a skipped matrix job reports
  # under its unexpanded name `browser`, never as `browser (1)`, so requiring the
  # shards by name would leave every docs-only pull request waiting forever.
  #
  # Skipped counts as passing only when `changes` said nothing but prose moved.
  # Once code changed, every gate must actually have succeeded — a gate that
  # skipped itself then is a bug in its `if`, not a pass.
  verified:
    needs: [changes, checks, browser, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          GATES: ${{ needs.checks.result }} ${{ needs.browser.result }} ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES (code changed: ${CODE:-unknown}); checks, browser, build: $GATES"
          [ "$CHANGES" = success ] || { echo "::error::the changes job did not succeed"; exit 1; }
          for result in $GATES; do
            case "$result" in
              success) ;;
              skipped) [ "$CODE" = false ] || { echo "::error::a gate was skipped although code changed"; exit 1; } ;;
              *) echo "::error::a gate ended $result"; exit 1 ;;
            esac
          done

  # Something has to notice. The merge of #30 went red on `main` at 08:51 and nobody saw it: the next
  # branch off main inherited a failing suite, and an afternoon went into proving the failure was not
  # the change under review. A pull request's own red X is on screen where its author is looking; a
  # red push to main is on a page nobody has open. This job is the shout.
  #
  # It is not a substitute for requiring these checks before a merge - that is a branch protection
  # setting and lives outside this file - but it is the half that can live in the repository.
  #
  # `changes` and `verified` are in the list because either can be the only red
  # job: a broken diff step skips every gate after it, and nothing below it fails.
  alarm:
    needs: [changes, checks, browser, build, verified]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const run = context.serverUrl + '/' + context.repo.owner + '/'
              + context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'The verify suite failed on `main` at ' + context.sha + '.',
              '',
              run,
              '',
              'Nothing merged after this is trustworthy until it is green: a branch cut from',
              'here inherits the failure and will look like its own regression.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'red-main',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'main is red: ' + sha, body,
                labels: ['red-main'],
              });
            }

  # The fast gates. Nothing here needs a browser, so nothing here waits for one.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # vinext build strips types rather than checking them, so nothing else in
      # this pipeline would notice a type error before it shipped.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Sixty seeded bot descents at two skill levels, held to loose bands in
      # scripts/balance/bands.json. Nothing else notices a change that quietly
      # makes the keep lethal or trivial: every other gate asserts rules, not
      # outcomes. About a minute. When it fails on a change that meant to move
      # the balance, re-measure and update bands.json in the same pull request,
      # so the new numbers are reviewed with the change; do not loosen a band to
      # get past a drift nobody intended.
      - run: npm run balance:check

  # Where the whole wall clock of this pipeline lives: the browser suite is
  # thirty-odd minutes of work and everything else is under a minute. It is cut
  # two ways at once.
  #
  # Across machines, by shard. Three. It was six while every scenario booted its
  # own page; now that a worker boots one and resets it, the work itself is down
  # from ~33 minutes to under twenty, and six shards would spend more of the run
  # on the ~50s of checkout, `npm ci` and dev server than on testing. Three also
  # halves what one run holds: at eight jobs a run, two overlapping runs came
  # close enough to a public repository's concurrency limit that a third queued.
  # The split is by measured duration, not Playwright's `--shard`, which cuts the
  # list into equal test counts in file order and so put the heavy, alphabetically
  # adjacent specs on one machine (9.2 minutes against 1.8). scripts/shards/plan.ts
  # hands each job its specs from scripts/shards/durations.json; refresh that file
  # from a green run's logs with scripts/shards/refresh.ts when the suite changes.
  #
  # And on each machine, by worker. The single worker was never a correctness
  # constraint — see the note in playwright.config.ts — and a runner has four
  # cores that one software rasteriser cannot use. Two is deliberate rather than
  # four: SwiftShader is CPU-bound, so the second worker nearly pays for itself
  # and the third and fourth would mostly contend. Lower it to 1 here if a
  # scenario ever turns out to mind the company; nothing else needs to change.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: game
    env:
      GAME_TEST_WORKERS: 2
      # The reference frames are for a human, nothing asserts on them, and the
      # upload below only fires on a failure — so a green run drew eighty
      # software-rasterised frames and deleted them. Ask for them explicitly.
      GAME_TEST_CAPTURE: ${{ inputs.captures && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      # `@capture` scenarios only stage frames for a human, and `@nightly` ones pin
      # art tuning or repeat a check the gate already makes; neither guards a PR.
      # The nightly isolated run (isolated.yml) still runs both, and a capture
      # run draws everything.
      - run: |
          specs=$(node --experimental-strip-types scripts/shards/plan.ts 3 ${{ matrix.shard }})
          echo "shard ${{ matrix.shard }}/3 runs: $specs"
          npm run test:browser -- $specs ${{ !inputs.captures && '--grep-invert "@capture|@nightly"' || '' }}
      # Traces and screenshots are only written when something failed, and they
      # are the whole reason a red run is diagnosable without a local repro.
      # The capture run uploads on success too: the frames are its entire point.
      - if: failure() || inputs.captures
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            game/playwright-report
            game/test-results
          retention-days: 7

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The build runs on pull requests too: a build that no longer compiles is
      # exactly what a pull request should catch, before main is the thing broken.
      - run: npm run build

      # GitHub Pages serves from a repository sub-path; the export writes
      # root-absolute asset URLs. See scripts/pages-relative-paths.mjs.
      # Unconditional so that a regression in the rewrite surfaces on the pull
      # request rather than on the deploy that follows the merge.
      - run: node scripts/pages-relative-paths.mjs dist/client

      # Not verification — this only hands the built site to the deploy job, so
      # it is skipped when no deploy can follow. Uploading an artifact needs no
      # GITHUB_TOKEN permission, which is why it can stay in this read-only job.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: game/dist/client
          # Preserve v3's inclusion of dotfiles such as .nojekyll.
          include-hidden-files: true

  deploy:
    # Every gate, then the deployment. This is the line that keeps a red suite
    # off the live site.
    needs: [changes, checks, browser, build]
    # A pull request must never be able to publish to Pages, whatever it changed.
    # And a docs-only push has no artifact to publish: the gates and the build
    # were skipped, so the site stays on the last code push's deployment. A
    # skipped `needs` would already stop this job; the `code` test says so
    # outright rather than leaning on that rule.
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Write access lives here alone, in the one job no pull request can trigger.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let a running deployment finish; queue at most one more behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Moved off the build job because it reads the Pages API with the workflow
      # token, which a pull request run is deliberately not given.
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
